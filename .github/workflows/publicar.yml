# Publica a pasta "frontend" no GitHub Pages a cada envio pra branch main.
name: Publicar painel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Troca "__VERSAO__" pelo código desta publicação: o navegador baixa os arquivos novos.
      - name: Marcar a versão nos arquivos
        run: sed -i "s/__VERSAO__/${GITHUB_SHA::8}/g" frontend/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deploy
        uses: actions/deploy-pages@v4
